<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d1a"><title>Steem Flags Shop</title><link rel="stylesheet" href="css/style.css?v=20260830-footer-01"><link rel="stylesheet" href="css/preloader.css?v=20260826-01"><script src="js/preloader.js?v=20260826-01" defer></script><script src="js/d2e-logo.js?v=20260825-02" defer></script></head><body><div id="app"></div><script type="module">
import{loadMenu}from'./js/menu.js?v=20260820-05';import{loadAssetBar,refreshAssetBar}from'./js/asset-bar.js?v=20260826-assetbar-07';import{getLanguage,setLanguage}from'./js/i18n.js';import{getPageText,applyPageLanguage}from'./js/page-i18n.js';
const API_BASE='https://steemflags.mehdiq.workers.dev',ENERGY_PRICE=10,DAILY_LIMIT=10,SESSION_KEY='steemFlagsAuthSession';
function user(){try{const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null'),u=String(s?.username||'').trim().toLowerCase();return/^[a-z0-9.-]{3,32}$/.test(u)?u:null}catch{return null}}
function lang(){return getLanguage()}
function render(){const t=getPageText(lang()),e=document.getElementById('shopEnergy'),d=document.getElementById('shopD2E'),l=document.getElementById('shopLimit'),b=document.getElementById('buyEnergyButton'),m=document.getElementById('shopMessage');applyPageLanguage(document,lang());document.title=t.shopTitle;document.querySelector('.shopDescription').innerHTML=`${t.buyEnergy} <strong>${ENERGY_PRICE} D2E.</strong>`;b.textContent=`${t.buy} — ${ENERGY_PRICE} D2E`;if(window.__shopState){e.textContent=window.__shopState.energy;d.textContent=window.__shopState.d2e;l.textContent=window.__shopState.left;m.textContent=window.__shopState.message;b.disabled=window.__shopState.disabled}}
async function status(u){const r=await fetch(`${API_BASE}/api/shop/energy?username=${encodeURIComponent(u)}`,{cache:'no-store'});if(!r.ok)throw Error('status');return r.json()}
async function refresh(u){const e=document.getElementById('shopEnergy'),d=document.getElementById('shopD2E'),l=document.getElementById('shopLimit'),b=document.getElementById('buyEnergyButton'),m=document.getElementById('shopMessage');if(!u){window.__shopState={energy:'—',d2e:'—',left:'—',message:getPageText(lang()).loginFirst,disabled:true};render();return}const a=await refreshAssetBar(u);if(!a){window.__shopState={energy:'—',d2e:'—',left:'—',message:getPageText(lang()).validate,disabled:true};render();return}try{const s=await status(u),p=Math.max(0,Number(s.purchasedToday)||0),left=Math.max(0,DAILY_LIMIT-p),d2e=Math.max(0,Math.floor(Number(a.D2E)||0)),energy=Math.max(0,Math.floor(Number(a.Energy)||0)),t=getPageText(lang());window.__shopState={energy,d2e,left,message:d2e<ENERGY_PRICE?`${t.insufficient} ${ENERGY_PRICE} D2E.`:left<=0?t.limitReached:`${left} ${t.remaining}`,disabled:d2e<ENERGY_PRICE||left<=0};render();b.onclick=()=>buy(u)}catch{window.__shopState={energy:Math.max(0,Math.floor(Number(a.Energy)||0)),d2e:Math.max(0,Math.floor(Number(a.D2E)||0)),left:'—',message:getPageText(lang()).validate,disabled:true};render()}}
async function buy(u){const b=document.getElementById('buyEnergyButton'),m=document.getElementById('shopMessage'),t=getPageText(lang());b.disabled=true;m.textContent=t.processing;try{const r=await fetch(`${API_BASE}/api/shop/energy`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u}),cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok||!d.success){m.textContent=d.error==='Insufficient D2E'?`${t.insufficient} ${ENERGY_PRICE} D2E.`:d.error==='Daily energy purchase limit reached'?t.limitReached:t.network;b.disabled=false;return}const a=d.account||{};window.__shopState={energy:Math.floor(Number(a.Energy)||0),d2e:Math.floor(Number(a.D2E)||0),left:Math.max(0,DAILY_LIMIT-(Number(d.purchasedToday)||0)),message:t.successful,disabled:Number(d.purchasedToday)>=DAILY_LIMIT||Number(a.D2E)<ENERGY_PRICE};render();await refreshAssetBar(u)}catch{m.textContent=t.network;b.disabled=false}}
async function init(){const app=document.getElementById('app'),r=await fetch('./components/app-shell.html?v=20260830-footer-01',{cache:'no-store'});app.innerHTML=await r.text();['loginView','homeView','leaderboardSection','gameView'].forEach(id=>document.getElementById(id)?.remove());document.querySelector('main.appShell').innerHTML=`<section class="shopContent"><img class="gameLogo logoMedium" src="https://raw.githubusercontent.com/mehdiq1980/steemflags/275937b489fd47e79ec71d509dae12ca8dc772e6/assets/steemflags_logo.png" alt="Steem Flags logo"><h1 data-page-i18n="shopTitle"></h1><div class="shopCard"><h2 data-page-i18n="energy"></h2><p class="shopDescription"></p><div class="shopStats"><div><span data-page-i18n="currentEnergy"></span><strong id="shopEnergy">—</strong></div><div><span data-page-i18n="availableD2E"></span><strong id="shopD2E">—</strong></div><div><span data-page-i18n="purchasesLeft"></span><strong id="shopLimit">—</strong></div></div><button id="buyEnergyButton" class="primary" type="button"></button><p id="shopMessage" class="shopMessage" role="status" aria-live="polite"></p></div><a href="./" class="primary" data-page-i18n="back"></a></section>`;await loadAssetBar();await loadMenu();const u=user();await refresh(u);const select=document.getElementById('languageSelect');if(select){select.value=lang();select.addEventListener('change',e=>{setLanguage(e.target.value);render()})}window.addEventListener('languagechange',render);window.dispatchEvent(new CustomEvent('steemflags:ready',{detail:{success:true}}))}init().catch(e=>{console.error(e);document.getElementById('app').innerHTML='<main class="appShell"><section class="shopContent"><h1>Shop</h1><p>Unable to load the Shop. Please refresh the page.</p></section></main>';window.dispatchEvent(new CustomEvent('steemflags:ready',{detail:{success:false,error:e}}))});
</script><style>.shopContent{border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:28px 22px;max-width:760px;margin:0 auto;text-align:center}.shopContent h1{margin:16px 0 24px}.shopCard{background:rgba(17,26,48,.94);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:22px;margin:0 auto 24px;max-width:620px}.shopDescription{opacity:.85}.shopStats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.shopStats div{padding:12px 8px;border-radius:12px;background:rgba(255,255,255,.06)}.shopStats span{display:block;font-size:.8rem;opacity:.75;margin-bottom:5px}.shopStats strong{font-size:1.2rem}.shopCard button{width:100%;max-width:420px}.shopMessage{min-height:1.4em;margin:14px 0 0;opacity:.85}@media(max-width:520px){.shopStats{grid-template-columns:1fr}.shopContent{padding:24px 16px}}</style></body></html>
