<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d1a"><title>Steem Flags Shop</title><link rel="stylesheet" href="css/style.css?v=20260830-footer-01"><link rel="stylesheet" href="css/preloader.css?v=20260826-01"><script src="js/preloader.js?v=20260826-01" defer></script><script src="js/d2e-logo.js?v=20260825-02" defer></script></head><body><div id="app"></div><script type="module">
import{loadMenu}from'./js/menu.js?v=20260820-05';import{loadAssetBar,refreshAssetBar}from'./js/asset-bar.js?v=20260826-assetbar-07';import{getLanguage,setLanguage}from'./js/i18n.js';import{getPageText,applyPageLanguage}from'./js/page-i18n.js';
const API_BASE='https://steemflags.mehdiq.workers.dev',ENERGY_PRICE_STEEM=0.2,MAX_ORDER=10,SESSION_KEY='steemFlagsAuthSession',DSTEEM_SOURCES=['https://unpkg.com/@esteemapp/dsteem@0.11.5/dist/dsteem.js','https://cdn.jsdelivr.net/npm/@esteemapp/dsteem@0.11.5/dist/dsteem.js'];
let dsteemPromise=null;
function user(){try{const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null'),u=String(s?.username||'').trim().toLowerCase();return/^[a-z0-9.-]{3,32}$/.test(u)?u:null}catch{return null}}
function lang(){return getLanguage()}
function loadDsteemScript(src){return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=src;script.async=true;const timer=setTimeout(()=>{script.remove();reject(new Error('AUTH_LIBRARY_TIMEOUT'))},10000);script.onload=()=>{clearTimeout(timer);globalThis.dsteem?.Client&&globalThis.dsteem?.PrivateKey?resolve(globalThis.dsteem):reject(new Error('AUTH_LIBRARY_INVALID'))};script.onerror=()=>{clearTimeout(timer);script.remove();reject(new Error('AUTH_LIBRARY_LOAD_FAILED'))};document.head.appendChild(script)})}
async function getDsteem(){if(globalThis.dsteem?.Client&&globalThis.dsteem?.PrivateKey)return globalThis.dsteem;if(!dsteemPromise)dsteemPromise=Promise.any(DSTEEM_SOURCES.map(loadDsteemScript)).catch(error=>{dsteemPromise=null;throw error});return dsteemPromise}
function selectedQuantity(){return Math.min(MAX_ORDER,Math.max(1,Math.floor(Number(document.getElementById('energyQuantity')?.value)||1)))}
function totalSteem(q=selectedQuantity()){return(q*ENERGY_PRICE_STEEM).toFixed(3)}
function updateTotal(){const q=selectedQuantity(),total=document.getElementById('energyTotal');if(total)total.textContent=totalSteem(q)+' STEEM';const value=document.getElementById('energyQuantity');if(value)value.value=String(q)}
function renderShoppingHistory(){const box=document.getElementById('shoppingTransactions');if(!box)return;const state=window.__shoppingHistory||{loading:false,transactions:[],error:false};const t=getPageText(lang());if(state.loading){box.innerHTML='<p class="shoppingHistoryMessage">'+(t.shoppingHistoryLoading||'Loading shopping transactions…')+'</p>';return}if(state.error){box.innerHTML='<p class="shoppingHistoryMessage">'+(t.shoppingHistoryError||'Unable to load shopping transactions. Please refresh the page.')+'</p>';return}if(!state.transactions.length){box.innerHTML='<p class="shoppingHistoryMessage">'+(t.shoppingHistoryEmpty||'No shopping transactions found.')+'</p>';return}const rows=state.transactions.map(x=>{const date=new Date(x.CreatedAt||'');const dateText=Number.isNaN(date.getTime())?String(x.CreatedAt||'—'):date.toLocaleString();const tx=String(x.TxId||'');const txText=tx?tx.slice(0,10)+'…'+tx.slice(-8):'—';const status=String(x.Status||'').toLowerCase();const statusText=status==='completed'?'✅ '+(t.shoppingHistoryCompleted||'Completed'):status==='pending'?'⏳ '+(t.shoppingHistoryPending||'Pending'):'⚠️ '+(status||'Unknown');return '<tr><td>'+dateText+'</td><td>⚡ '+String(x.Quantity||0)+'</td><td>'+String(x.Amount||'—')+' STEEM</td><td><code>'+String(x.OrderId||'—')+'</code></td><td><code title="'+tx.replace(/"/g,'&quot;')+'">'+txText+'</code></td><td>'+statusText+'</td></tr>'}).join('');box.innerHTML='<div class="shoppingHistoryTableWrap"><table class="shoppingHistoryTable"><thead><tr><th>'+(t.shoppingHistoryDate||'Date')+'</th><th>'+(t.shoppingHistoryEnergy||'Energy')+'</th><th>'+(t.shoppingHistoryAmount||'Amount')+'</th><th>'+(t.shoppingHistoryOrder||'Order')+'</th><th>'+(t.shoppingHistoryTx||'Transaction')+'</th><th>'+(t.shoppingHistoryStatus||'Status')+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>'}
async function loadShoppingHistory(u){window.__shoppingHistory={loading:true,transactions:[],error:false};renderShoppingHistory();if(!u){window.__shoppingHistory={loading:false,transactions:[],error:false};renderShoppingHistory();return}try{const r=await fetch(API_BASE+'/api/shop/transactions?username='+encodeURIComponent(u),{cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.error||'SHOP_TRANSACTIONS_FAILED');window.__shoppingHistory={loading:false,transactions:Array.isArray(d.transactions)?d.transactions:[],error:false};renderShoppingHistory()}catch{window.__shoppingHistory={loading:false,transactions:[],error:true};renderShoppingHistory()}}
function render(){const t=getPageText(lang());applyPageLanguage(document,lang());document.title=t.shopTitle;updateTotal();renderShoppingHistory();if(window.__shopState){const e=document.getElementById('shopEnergy'),m=document.getElementById('shopMessage'),b=document.getElementById('buyEnergyButton');if(e)e.textContent=window.__shopState.energy;if(m)m.textContent=window.__shopState.message;if(b){b.disabled=window.__shopState.disabled;b.textContent=t.buyMoreEnergy}}}
async function status(u){const r=await fetch(API_BASE+'/api/shop/energy?username='+encodeURIComponent(u),{cache:'no-store'});if(!r.ok)throw Error('status');return r.json()}
async function refresh(u){const e=document.getElementById('shopEnergy'),m=document.getElementById('shopMessage'),b=document.getElementById('buyEnergyButton');if(!u){window.__shopState={energy:'—',message:getPageText(lang()).loginFirst,disabled:true};render();return}try{const s=await status(u),energy=Math.max(0,Math.floor(Number(s.Energy)||0));window.__shopState={energy,message:getPageText(lang()).readyToBuy,disabled:false};render();b.onclick=()=>buy(u)}catch{window.__shopState={energy:'—',message:getPageText(lang()).validate,disabled:true};render()}}
async function createOrder(u,q){const r=await fetch(API_BASE+'/api/shop/energy/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,quantity:q}),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.error||'ORDER_FAILED');return d}
async function verify(u,orderId,txId){const r=await fetch(API_BASE+'/api/shop/energy/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,orderId,txId}),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.error||'VERIFY_FAILED');return d}
async function buy(u){const b=document.getElementById('buyEnergyButton'),m=document.getElementById('shopMessage'),keyInput=document.getElementById('activeKey'),q=selectedQuantity(),t=getPageText(lang());b.disabled=true;m.textContent=t.creatingOrder;let privateKey=null;try{if(!keyInput?.value.trim())throw new Error('ACTIVE_KEY_REQUIRED');const order=await createOrder(u,q);m.textContent=t.paymentProcessing.replace('{amount}',order.amount).replace('{memo}',order.orderId);const dsteem=await getDsteem();privateKey=dsteem.PrivateKey.fromString(keyInput.value.trim());const client=new dsteem.Client('https://api.steemit.com');const result=await client.broadcast.transfer({from:u,to:'do2earn',amount:order.amount+' STEEM',memo:order.orderId},privateKey);privateKey=null;keyInput.value='';const txId=String(result?.id||result?.tx_id||'').trim();if(!txId)throw new Error('TX_ID_MISSING');m.textContent=t.verifyingPayment;const confirmed=await verify(u,order.orderId,txId);window.__shopState={energy:Math.max(0,Math.floor(Number(confirmed.account?.Energy)||0)),message:t.purchaseSuccess.replace('{energy}',String(q)),disabled:false};render();await refreshAssetBar(u);await loadShoppingHistory(u)}catch(error){privateKey=null;if(keyInput)keyInput.value='';const code=String(error?.message||'');m.textContent=code==='ACTIVE_KEY_REQUIRED'?t.activeKeyRequired:code==='ORDER_FAILED'?t.orderFailed:code==='VERIFY_FAILED'?t.paymentPending:t.paymentError;b.disabled=false}}
async function init(){const app=document.getElementById('app'),r=await fetch('./components/app-shell.html?v=20260830-footer-01',{cache:'no-store'});app.innerHTML=await r.text();['loginView','homeView','leaderboardSection','gameView'].forEach(id=>document.getElementById(id)?.remove());document.querySelector('main.appShell').innerHTML=`<section class="shopContent"><img class="gameLogo logoMedium" src="https://raw.githubusercontent.com/mehdiq1980/steemflags/275937b489fd47e79ec71d509dae12ca8dc772e6/assets/steemflags_logo.png" alt="Steem Flags logo"><h1 data-page-i18n="shopTitle"></h1><div class="shopCard energyCard"><h2 data-page-i18n="energy"></h2><p class="shopDescription" data-page-i18n="energyShopDescription"></p><div class="shopStats"><div><span data-page-i18n="currentEnergy"></span><strong id="shopEnergy">—</strong></div><div><span data-page-i18n="energyPrice"></span><strong>0.200 STEEM</strong></div></div><label class="quantityLabel" for="energyQuantity" data-page-i18n="energyQuantity"></label><div class="quantityPicker"><button type="button" id="quantityMinus" aria-label="Decrease energy">−</button><input id="energyQuantity" type="number" min="1" max="10" step="1" value="1" inputmode="numeric"><button type="button" id="quantityPlus" aria-label="Increase energy">+</button></div><p class="totalLine"><span data-page-i18n="total"></span> <strong id="energyTotal">0.200 STEEM</strong></p><label class="keyLabel" for="activeKey" data-page-i18n="activeKey"></label><input id="activeKey" class="activeKeyInput" type="password" autocomplete="off" spellcheck="false" placeholder="5K..."><p class="securityNote" data-page-i18n="activeKeySecurity"></p><button id="buyEnergyButton" class="primary" type="button" data-page-i18n="buyMoreEnergy"></button><p id="shopMessage" class="shopMessage" role="status" aria-live="polite"></p></div><div class="shopCard premiumCard"><h2 data-page-i18n="premiumTitle"></h2><p data-page-i18n="premiumDescription"></p><div class="premiumBadge" data-page-i18n="comingSoon"></div><p class="premiumFuture" data-page-i18n="premiumFuture"></p></div><div class="shopCard shoppingHistoryCard"><h2>🧾 <span data-page-i18n="shoppingHistoryTitle"></span></h2><div id="shoppingTransactions" class="shoppingTransactions"></div></div><a href="./" class="primary" data-page-i18n="back"></a></section>`;await loadAssetBar();await loadMenu();const u=user();await refresh(u);await loadShoppingHistory(u);const input=document.getElementById('energyQuantity');document.getElementById('quantityMinus').onclick=()=>{input.value=String(Math.max(1,selectedQuantity()-1));updateTotal()};document.getElementById('quantityPlus').onclick=()=>{input.value=String(Math.min(MAX_ORDER,selectedQuantity()+1));updateTotal()};input.addEventListener('input',updateTotal);input.addEventListener('change',updateTotal);const select=document.getElementById('languageSelect');if(select){select.value=lang();select.addEventListener('change',e=>{setLanguage(e.target.value);render()})}window.addEventListener('languagechange',render);window.dispatchEvent(new CustomEvent('steemflags:ready',{detail:{success:true}}))}init().catch(e=>{console.error(e);document.getElementById('app').innerHTML='<main class="appShell"><section class="shopContent"><h1>Shop</h1><p>Unable to load the Shop. Please refresh the page.</p></section></main>';window.dispatchEvent(new CustomEvent('steemflags:ready',{detail:{success:false,error:e}}))});
</script><style>.shopContent{border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:28px 22px;max-width:760px;margin:0 auto;text-align:center}.shopContent h1{margin:16px 0 24px}.shopCard{background:rgba(17,26,48,.94);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:22px;margin:0 auto 24px;max-width:620px}.shopDescription,.premiumCard p{opacity:.85}.shopStats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0}.shopStats div{padding:12px 8px;border-radius:12px;background:rgba(255,255,255,.06)}.shopStats span{display:block;font-size:.8rem;opacity:.75;margin-bottom:5px}.shopStats strong{font-size:1.2rem}.quantityLabel,.keyLabel{display:block;margin:16px 0 8px;font-weight:600}.quantityPicker{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto 12px}.quantityPicker button{width:48px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:inherit;font-size:1.5rem}.quantityPicker input{width:90px;height:44px;text-align:center;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:inherit;font-size:1.15rem}.totalLine{margin:12px 0 18px}.activeKeyInput{box-sizing:border-box;width:100%;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:inherit;padding:0 12px}.securityNote{font-size:.82rem;line-height:1.5;margin:10px 0 16px}.shopCard button.primary{width:100%;max-width:420px}.shopMessage{min-height:1.4em;margin:14px 0 0;opacity:.85}.premiumBadge{display:inline-block;margin:8px 0 14px;padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.2);font-weight:700}.premiumFuture{margin-bottom:0}.shoppingHistoryCard{text-align:left}.shoppingHistoryMessage{text-align:center;opacity:.8;margin:8px 0}.shoppingHistoryTableWrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}.shoppingHistoryTable{width:100%;min-width:720px;border-collapse:collapse;font-size:.86rem}.shoppingHistoryTable th,.shoppingHistoryTable td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.1);white-space:nowrap}.shoppingHistoryTable th{text-align:center;font-weight:700}.shoppingHistoryTable td{text-align:center}.shoppingHistoryTable code{font-size:.78rem}.shoppingHistoryTable tbody tr:last-child td{border-bottom:0}@media(max-width:520px){.shopStats{grid-template-columns:1fr}.shopContent{padding:24px 16px}.shopCard{padding:20px 16px}}</style></body></html>
