<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d1a">
  <meta name="robots" content="noindex,nofollow">
  <title>Steem Flags | Temporarily Disabled</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    html, body {
      min-height: 0;
      background: #080d1a !important;
    }
    body {
      min-height: 0;
      background: #080d1a;
    }
    .disabledPage {
      flex: 0 0 auto;
      width: min(760px, 92vw);
      margin: 0 auto;
      padding: 30px 0 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .disabledLogo {
      display: block;
      width: min(170px, 44vw);
      height: auto;
      object-fit: contain;
      margin: 0 auto 20px;
    }
    .disabledMessage {
      margin: 0;
      color: #d9828c;
      font-size: clamp(1.35rem, 4.5vw, 1.8rem);
      line-height: 1.3;
      font-weight: 800;
      text-align: center;
    }
    @media (max-width: 560px) {
      .disabledPage { padding: 24px 0 20px; }
      .disabledLogo { width: min(145px, 40vw); margin-bottom: 16px; }
      .disabledMessage { font-size: clamp(1.25rem, 5vw, 1.55rem); }
    }
  </style>
</head>
<body>
  <main class="disabledPage">
    <img class="disabledLogo" src="./assets/steemflags_logo.png" alt="Steem Flags official logo">
    <h1 class="disabledMessage">This Web 3.0 game has been temporarily disabled.</h1>
  </main>
  <footer class="siteFooter">
    <div><a href="https://do2earn.dev" target="_blank" rel="noopener noreferrer">© Do2Earn</a></div>
    <div><a href="https://discord.gg/7TwbZCdNj" target="_blank" rel="noopener noreferrer">© Steem Gaming Hub</a></div>
  </footer>
</body>
</html>
