const ABOUT_TRANSLATIONS={
en:{title:'About 🏳️ Steem Flags',tagline:'Guess the Flags & Earn $STEEM',p1:'Steem Flags is a Web 3.0 game based on the Steem blockchain network in the Quiz and Education genres and developed by <a href="https://do2earn.dev" target="_blank"><b>Do2Earn</b></a>.',p2:'In Steem Flags, players increase their geographical knowledge by answering questions about the flags of countries around the world and earn D2E (Do2Earn) non-cashable in-game tokens in a competitive environment.',economy:'💰 Steem Flags Economy',p3:'In Steem Flags, players can receive non-cashable in-game tokens called D2E (Do2Earn) as rewards based on their daily Energy (Default: 30) asset by participating in the game process and watching Sponsors Ads.',p4:'By collecting D2E, players can compete on the leaderboard and improve their position among other players. In the future, 50% of sponsorship revenue will be saved in the Steem Rewards Pool. The weekly Steem Rewards Pool will be activated in-game, distributing 100 or more $STEEM to the top 5 players on the game leaderboard, based on their D2E holdings. The Steem Flags rewards system is designed to incentivize further learning, active participation, and healthy competition.',join:'👉 Join Steem Flags & Test it',sponsor:'📣 Join Steem Flags Sponsors & Help players earn $STEEM'},
fa:{title:'درباره 🏳️ Steem Flags',tagline:'پرچم‌ها را حدس بزنید و $STEEM کسب کنید',p1:'Steem Flags یک بازی Web 3.0 بر پایه شبکه بلاک‌چین Steem در سبک‌های مسابقه‌ای و آموزشی است.',p2:'در Steem Flags، بازیکنان با پاسخ دادن به پرسش‌هایی درباره پرچم کشورهای سراسر جهان، دانش جغرافیایی خود را افزایش می‌دهند و در یک محیط رقابتی توکن‌های درون‌بازی غیرقابل تبدیل به پول نقد D2E (Do2Earn) کسب می‌کنند.',economy:'💰 اقتصاد Steem Flags',p3:'در Steem Flags، بازیکنان می‌توانند با شرکت در فرایند بازی و تماشای تبلیغات اسپانسرها، بر اساس دارایی انرژی روزانه خود (پیش‌فرض: ۳۰)، توکن‌های درون‌بازی غیرقابل تبدیل به پول نقد D2E (Do2Earn) را به‌عنوان پاداش دریافت کنند.',p4:'با جمع‌آوری D2E، بازیکنان می‌توانند در لیدربورد رقابت کنند و جایگاه خود را در میان سایر بازیکنان بهبود دهند. در آینده، ۵۰٪ از درآمد اسپانسرها در استخر پاداش Steem ذخیره خواهد شد. استخر پاداش هفتگی Steem در بازی فعال خواهد شد و بر اساس میزان D2E بازیکنان، ۱۰۰ یا بیشتر $STEEM را میان ۵ بازیکن برتر لیدربورد توزیع خواهد کرد. سیستم پاداش Steem Flags برای تشویق به یادگیری بیشتر، مشارکت فعال و رقابت سالم طراحی شده است.',join:'👉 به Steem Flags بپیوندید و آن را امتحان کنید',sponsor:'📣 به اسپانسرهای Steem Flags بپیوندید و به بازیکنان برای کسب $STEEM کمک کنید'},
es:{title:'Acerca de 🏳️ Steem Flags',tagline:'Adivina las banderas y gana $STEEM',p1:'Steem Flags es un juego Web 3.0 basado en la red blockchain de Steem, dentro de los géneros de Quiz y Educación.',p2:'En Steem Flags, los jugadores aumentan sus conocimientos geográficos respondiendo preguntas sobre las banderas de países de todo el mundo y ganan tokens D2E (Do2Earn) no canjeables por dinero en un entorno competitivo.',economy:'💰 Economía de Steem Flags',p3:'En Steem Flags, los jugadores pueden recibir tokens D2E (Do2Earn) no canjeables por dinero como recompensa, según su energía diaria (predeterminado: 30), al participar en el juego y ver anuncios de patrocinadores.',p4:'Al acumular D2E, los jugadores pueden competir en la clasificación y mejorar su posición. En el futuro, el 50% de los ingresos de patrocinio se guardará en el Steem Rewards Pool. El fondo semanal distribuirá 100 $STEEM o más entre los 5 mejores jugadores según sus D2E. El sistema de recompensas de Steem Flags está diseñado para incentivar el aprendizaje, la participación activa y la competencia saludable.',join:'👉 Únete a Steem Flags y pruébalo',sponsor:'📣 Únete a los patrocinadores de Steem Flags y ayuda a los jugadores a ganar $STEEM'},
zh:{title:'关于 🏳️ Steem Flags',tagline:'猜国旗，赚取 $STEEM',p1:'Steem Flags 是一款基于 Steem 区块链网络的 Web 3.0 游戏，属于问答和教育类游戏。',p2:'在 Steem Flags 中，玩家通过回答世界各国国旗相关问题提升地理知识，并在竞争环境中获得不可兑换现金的 D2E（Do2Earn）游戏内代币。',economy:'💰 Steem Flags 经济系统',p3:'在 Steem Flags 中，玩家可以通过参与游戏和观看赞助商广告，根据每日能量（默认：30）获得不可兑换现金的 D2E（Do2Earn）游戏内代币奖励。',p4:'通过积累 D2E，玩家可以在排行榜上竞争并提升排名。未来，50%的赞助收入将存入 Steem 奖励池。每周 Steem 奖励池将在游戏中启用，根据 D2E 持有量向排行榜前5名玩家分配100 $STEEM或更多。Steem Flags 奖励系统旨在鼓励持续学习、积极参与和健康竞争。',join:'👉 加入 Steem Flags 并体验游戏',sponsor:'📣 成为 Steem Flags 赞助商，帮助玩家赚取 $STEEM'},
ko:{title:'🏳️ Steem Flags 소개',tagline:'국기를 맞히고 $STEEM을 획득하세요',p1:'Steem Flags는 Steem 블록체인 네트워크를 기반으로 한 Web 3.0 게임으로 퀴즈 및 교육 장르에 속합니다.',p2:'Steem Flags에서 플레이어는 전 세계 국가의 국기에 관한 질문에 답하며 지리 지식을 높이고 경쟁 환경에서 현금으로 교환할 수 없는 D2E(Do2Earn) 게임 내 토큰을 획득합니다.',economy:'💰 Steem Flags 경제',p3:'플레이어는 게임에 참여하고 스폰서 광고를 시청하여 일일 에너지(기본값: 30)를 기준으로 현금으로 교환할 수 없는 D2E(Do2Earn) 게임 내 토큰을 보상으로 받을 수 있습니다.',p4:'D2E를 모으면 리더보드에서 경쟁하고 순위를 높일 수 있습니다. 향후 스폰서 수익의 50%가 Steem Rewards Pool에 저장됩니다. 주간 Steem Rewards Pool은 게임에서 활성화되어 D2E 보유량을 기준으로 상위 5명에게 100 $STEEM 이상을 분배합니다. Steem Flags 보상 시스템은 지속적인 학습, 적극적인 참여 및 건전한 경쟁을 장려하도록 설계되었습니다.',join:'👉 Steem Flags에 참여하고 테스트하기',sponsor:'📣 Steem Flags 스폰서가 되어 플레이어의 $STEEM 획득을 도와주세요'},
hi:{title:'🏳️ Steem Flags के बारे में',tagline:'झंडों का अनुमान लगाएँ और $STEEM कमाएँ',p1:'Steem Flags Steem ब्लॉकचेन नेटवर्क पर आधारित एक Web 3.0 गेम है, जो क्विज़ और शिक्षा श्रेणियों में आता है।',p2:'Steem Flags में खिलाड़ी दुनिया भर के देशों के झंडों से जुड़े प्रश्नों के उत्तर देकर अपना भौगोलिक ज्ञान बढ़ाते हैं और प्रतिस्पर्धी वातावरण में गैर-नकदी D2E (Do2Earn) इन-गेम टोकन कमाते हैं।',economy:'💰 Steem Flags अर्थव्यवस्था',p3:'खिलाड़ी गेम में भाग लेकर और प्रायोजक विज्ञापन देखकर अपनी दैनिक ऊर्जा (डिफ़ॉल्ट: 30) के आधार पर गैर-नकदी D2E (Do2Earn) इन-गेम टोकन पुरस्कार प्राप्त कर सकते हैं।',p4:'D2E जमा करके खिलाड़ी लीडरबोर्ड पर प्रतिस्पर्धा कर सकते हैं और अपनी स्थिति सुधार सकते हैं। भविष्य में प्रायोजन आय का 50% Steem Rewards Pool में रखा जाएगा। साप्ताहिक Steem Rewards Pool गेम में सक्रिय होगा और D2E होल्डिंग्स के आधार पर शीर्ष 5 खिलाड़ियों को 100 या अधिक $STEEM वितरित करेगा। Steem Flags पुरस्कार प्रणाली सीखने, सक्रिय भागीदारी और स्वस्थ प्रतिस्पर्धा को प्रोत्साहित करने के लिए बनाई गई है।',join:'👉 Steem Flags में शामिल हों और इसे आज़माएँ',sponsor:'📣 Steem Flags के प्रायोजक बनें और खिलाड़ियों को $STEEM कमाने में मदद करें'},
ur:{title:'🏳️ Steem Flags کے بارے میں',tagline:'جھنڈوں کا اندازہ لگائیں اور $STEEM کمائیں',p1:'Steem Flags ایک Web 3.0 گیم ہے جو Steem بلاک چین نیٹ ورک پر مبنی ہے اور کوئز اور تعلیمی انواع میں شامل ہے۔',p2:'Steem Flags میں کھلاڑی دنیا بھر کے ممالک کے جھنڈوں سے متعلق سوالات کے جواب دے کر اپنی جغرافیائی معلومات میں اضافہ کرتے ہیں اور مسابقتی ماحول میں غیر نقدی D2E (Do2Earn) درونِ گیم ٹوکن کماتے ہیں۔',economy:'💰 Steem Flags کی معیشت',p3:'کھلاڑی گیم میں شرکت اور اسپانسر اشتہارات دیکھ کر اپنی روزانہ توانائی (ڈیفالٹ: 30) کی بنیاد پر غیر نقدی D2E (Do2Earn) درونِ گیم ٹوکن بطور انعام حاصل کر سکتے ہیں۔',p4:'D2E جمع کر کے کھلاڑی لیڈر بورڈ پر مقابلہ کر سکتے ہیں اور اپنی پوزیشن بہتر بنا سکتے ہیں۔ مستقبل میں اسپانسرشپ آمدنی کا 50٪ Steem Rewards Pool میں محفوظ کیا جائے گا۔ ہفتہ وار Steem Rewards Pool گیم میں فعال ہوگا اور D2E ہولڈنگز کی بنیاد پر ٹاپ 5 کھلاڑیوں کو 100 یا اس سے زیادہ $STEEM تقسیم کرے گا۔ Steem Flags کا انعامی نظام مزید سیکھنے، فعال شرکت اور صحت مند مقابلے کی حوصلہ افزائی کے لیے بنایا گیا ہے۔',join:'👉 Steem Flags میں شامل ہوں اور اسے آزمائیں',sponsor:'📣 Steem Flags کے اسپانسر بنیں اور کھلاڑیوں کو $STEEM کمانے میں مدد کریں'},
bn:{title:'🏳️ Steem Flags সম্পর্কে',tagline:'পতাকা অনুমান করুন এবং $STEEM উপার্জন করুন',p1:'Steem Flags হলো Steem ব্লকচেইন নেটওয়ার্কের উপর ভিত্তি করে তৈরি একটি Web 3.0 গেম, যা কুইজ ও শিক্ষামূলক ঘরানার।',p2:'Steem Flags-এ খেলোয়াড়রা বিশ্বের বিভিন্ন দেশের পতাকা সম্পর্কে প্রশ্নের উত্তর দিয়ে ভৌগোলিক জ্ঞান বাড়ায় এবং প্রতিযোগিতামূলক পরিবেশে নগদে রূপান্তরযোগ্য নয় এমন D2E (Do2Earn) ইন-গেম টোকেন অর্জন করে।',economy:'💰 Steem Flags অর্থনীতি',p3:'খেলোয়াড়রা গেমে অংশগ্রহণ এবং স্পনসর বিজ্ঞাপন দেখে দৈনিক শক্তি (ডিফল্ট: 30) অনুযায়ী নগদে রূপান্তরযোগ্য নয় এমন D2E (Do2Earn) ইন-গেম টোকেন পুরস্কার পেতে পারে।',p4:'D2E সংগ্রহ করে খেলোয়াড়রা লিডারবোর্ডে প্রতিযোগিতা করতে এবং অবস্থান উন্নত করতে পারে। ভবিষ্যতে স্পনসরশিপ আয়ের 50% Steem Rewards Pool-এ রাখা হবে। সাপ্তাহিক Steem Rewards Pool গেমে সক্রিয় হয়ে D2E হোল্ডিংসের ভিত্তিতে শীর্ষ 5 খেলোয়াড়কে 100 বা তার বেশি $STEEM বিতরণ করবে। Steem Flags-এর পুরস্কার ব্যবস্থা শেখা, সক্রিয় অংশগ্রহণ ও স্বাস্থ্যকর প্রতিযোগিতাকে উৎসাহিত করার জন্য তৈরি।',join:'👉 Steem Flags-এ যোগ দিন ও পরীক্ষা করুন',sponsor:'📣 Steem Flags-এর স্পনসর হন এবং খেলোয়াড়দের $STEEM উপার্জনে সহায়তা করুন'}
};

function renderAbout(){
 const lang=getLanguage();
 const tr=ABOUT_TRANSLATIONS[lang]||ABOUT_TRANSLATIONS.en;
 document.documentElement.lang=lang;
 document.documentElement.dir=['fa','ur'].includes(lang)?'rtl':'ltr';
 document.title=tr.title.replace('🏳️ ','')+' - Steem Flags';
 const main=document.querySelector('main.appShell');
 if(!main)return;
 main.innerHTML=`<section class="aboutContent">
 <img class="gameLogo logoMedium" src="https://raw.githubusercontent.com/mehdiq1980/steemflags/main/assets/steemflags_logo.png" alt="Steem Flags logo">
 <h1>${tr.title}</h1>
 <h2 class="aboutTagline">${tr.tagline}</h2>
 <div class="aboutText">
 <p>${tr.p1}</p>
 <p>${tr.p2}</p>
 <h2>${tr.economy}</h2>
 <div class="d2eAboutLogo"><img src="https://cdn.steemitimages.com/DQmV8Yj5oJxDDJagFF1y19GaFj3TGMgi6q4rjgT2jQSTsJ6/d2e_asset_logo1.png" alt="D2E"></div>
 <p>${tr.p3}</p>
 <p>${tr.p4}</p>
 </div>
 <div class="aboutLinks">
 <a class="primary" href="https://mehdiq1980.github.io/steemflags/">${tr.join}</a>
 <a class="primary sponsorLink" href="https://forms.gle/u7sRXfW1hqNzLAxJ6" target="_blank" rel="noopener">${tr.sponsor}</a>
 </div>
 </section>`;
}

async function loadAboutPage(){
 const app=document.getElementById('app');
 const response=await fetch('./components/app-shell.html?v=20260904-about-01',{cache:'no-store'});
 app.innerHTML=await response.text();
 ['loginView','homeView','leaderboardSection','gameView'].forEach(id=>document.getElementById(id)?.remove());
 const main=document.querySelector('main.appShell');
 if(main)main.innerHTML='<section class="aboutContent"></section>';
 const username=getStoredUsername();
 await loadSharedAssetBar();
 if(username){await syncPurchasedEnergy(refreshDailyEnergy(loadState(username),username),username);await refreshAssetBar(username)}
 await loadMenu();
 renderAbout();
 window.addEventListener('languagechange',renderAbout);
 window.dispatchEvent(new CustomEvent('steemflags:ready'));
}
loadAboutPage().catch(error=>{console.error(error);window.dispatchEvent(new CustomEvent('steemflags:ready'))});
</script>
