name: Verify do2earn D1 Restore

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/verify-d1-restore.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check required secret
        env:
          CF_TOKEN: ${{ secrets.STEEMFLAGS_D1_BACKUP }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "Missing D1 access token"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Missing Cloudflare account ID"; exit 1; }

      - name: Verify restored data (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STEEMFLAGS_D1_BACKUP }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -uo pipefail
          query="SELECT (SELECT COUNT(*) FROM accounts) AS accounts, (SELECT COUNT(*) FROM ad_sessions) AS ad_sessions, (SELECT COUNT(*) FROM app_migrations) AS app_migrations, (SELECT COUNT(*) FROM daily_rewards) AS daily_rewards, (SELECT COUNT(*) FROM energy_orders) AS energy_orders, (SELECT COUNT(*) FROM energy_purchases) AS energy_purchases, (SELECT COUNT(*) FROM game_events) AS game_events, (SELECT COUNT(*) FROM sponsor_ad_events) AS sponsor_ad_events, (SELECT COUNT(*) FROM sponsor_ad_sessions) AS sponsor_ad_sessions;"
          echo "Running read-only row-count query against destination database do2earn."
          set +e
          npx --yes wrangler@latest d1 execute do2earn --remote --command "$query" --json --config cloudflare/wrangler.toml > "$RUNNER_TEMP/restored-counts.json" 2> "$RUNNER_TEMP/wrangler.stderr"
          rc=$?
          set -e
          echo "Wrangler exit code: $rc"
          if [ -s "$RUNNER_TEMP/wrangler.stderr" ]; then
            echo "Wrangler stderr:"
            sed -E 's/(Bearer )[A-Za-z0-9._-]+/\\1[REDACTED]/g' "$RUNNER_TEMP/wrangler.stderr"
          fi
          if [ -s "$RUNNER_TEMP/restored-counts.json" ]; then
            echo "Wrangler stdout (first 4000 bytes):"
            head -c 4000 "$RUNNER_TEMP/restored-counts.json"
            echo
          else
            echo "Wrangler stdout is empty."
          fi
          if [ "$rc" -ne 0 ]; then
            echo "ERROR: Wrangler failed before verification could parse row counts."
            exit "$rc"
          fi
          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync(process.env.RUNNER_TEMP + '/restored-counts.json', 'utf8');
          let data;
          try { data = JSON.parse(raw); } catch (e) { console.error('JSON parse failed: ' + e.message); process.exit(1); }
          const expected = {accounts:25, ad_sessions:22, app_migrations:1, daily_rewards:42, energy_orders:1, energy_purchases:9, game_events:115, sponsor_ad_events:124, sponsor_ad_sessions:140};
          const found = {};
          function collect(x) {
            if (!x || typeof x !== 'object') return;
            if (Array.isArray(x)) { for (const item of x) collect(item); return; }
            for (const table of Object.keys(expected)) {
              if (Object.prototype.hasOwnProperty.call(x, table)) {
                const value = Number(x[table]);
                if (Number.isFinite(value)) found[table] = value;
              }
            }
            for (const value of Object.values(x)) collect(value);
          }
          collect(data);
          console.log('Read-only verification results:');
          for (const [table, count] of Object.entries(expected)) {
            console.log(table + ': ' + (found[table] ?? 'MISSING') + ' (expected ' + count + ')');
            if (found[table] !== count) process.exitCode = 1;
          }
          const total = Object.values(found).reduce((a, b) => a + b, 0);
          console.log('Total rows: ' + total + ' (expected 479)');
          if (Object.keys(found).length !== 9 || total !== 479) process.exitCode = 1;
          if (!process.exitCode) console.log('SUCCESS: all 9 table counts match. This workflow only reads data and does not alter the database.');
          NODE

      - name: Compare source and destination schema (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STEEMFLAGS_D1_BACKUP }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          query="SELECT type, name, tbl_name, COALESCE(sql,'') AS sql FROM sqlite_master WHERE name NOT LIKE 'sqlite_%' AND name != '_cf_KV' ORDER BY type, name;"
          for db in steemflags do2earn; do
            echo "Inspecting schema objects in $db (read-only)."
            npx --yes wrangler@latest d1 execute "$db" --remote --command "$query" --json --config cloudflare/wrangler.toml > "$RUNNER_TEMP/schema-$db.json"
          done
          node <<'NODE'
          const fs = require('fs');
          function findRows(value, out = []) {
            if (!value || typeof value !== 'object') return out;
            if (Array.isArray(value)) { for (const item of value) findRows(item, out); return out; }
            if (Object.hasOwn(value, 'type') && Object.hasOwn(value, 'name') && Object.hasOwn(value, 'tbl_name')) out.push(value);
            for (const v of Object.values(value)) findRows(v, out);
            return out;
          }
          function load(db) {
            const raw = fs.readFileSync(process.env.RUNNER_TEMP + '/schema-' + db + '.json', 'utf8');
            const data = JSON.parse(raw);
            const rows = findRows(data);
            const unique = [...new Map(rows.map(x => [x.type + ':' + x.name, x])).values()];
            if (!unique.length) throw new Error('No schema objects parsed for ' + db);
            return unique.map(x => ({type:String(x.type), name:String(x.name), tbl_name:String(x.tbl_name), sql:String(x.sql || '').replace(/\\s+/g,' ').trim()}))
              .sort((a,b) => (a.type+a.name).localeCompare(b.type+b.name));
          }
          const source = load('steemflags');
          const dest = load('do2earn');
          const fmt = x => JSON.stringify(x);
          console.log('Source schema objects:', source.length);
          console.log('Destination schema objects:', dest.length);
          for (const obj of dest) console.log('DESTINATION ' + obj.type + ': ' + obj.name + (obj.sql ? ' | ' + obj.sql : ''));
          const sourceTables = source.filter(x => x.type === 'table').map(x => x.name).sort();
          const destTables = dest.filter(x => x.type === 'table').map(x => x.name).sort();
          const sourceIndexes = source.filter(x => x.type === 'index').map(x => x.name).sort();
          const destIndexes = dest.filter(x => x.type === 'index').map(x => x.name).sort();
          console.log('Source application tables:', sourceTables.length, sourceTables.join(', '));
          console.log('Destination application tables:', destTables.length, destTables.join(', '));
          console.log('Source explicit indexes:', sourceIndexes.length, sourceIndexes.join(', ') || '(none)');
          console.log('Destination explicit indexes:', destIndexes.length, destIndexes.join(', ') || '(none)');
          if (fmt(source) !== fmt(dest)) {
            console.error('FAIL: source and destination schema objects differ.');
            const src = new Map(source.map(x => [x.type + ':' + x.name, fmt(x)]));
            const dst = new Map(dest.map(x => [x.type + ':' + x.name, fmt(x)]));
            for (const [k,v] of src) if (dst.get(k) !== v) console.error('SOURCE DIFFERENCE: ' + k + ' => ' + v);
            for (const [k,v] of dst) if (src.get(k) !== v) console.error('DESTINATION DIFFERENCE: ' + k + ' => ' + v);
            process.exit(1);
          }
          if (destTables.length !== 9) {
            console.error('FAIL: expected 9 application tables, found ' + destTables.length);
            process.exit(1);
          }
          console.log('SUCCESS: source and destination schema objects match exactly (excluding SQLite internals and Cloudflare _cf_KV).');
          NODE
