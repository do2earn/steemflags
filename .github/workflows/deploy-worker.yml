name: Deploy Steem Flags Worker to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare/worker.js'
      - 'cloudflare/wrangler.toml'
      - 'cloudflare/migrations/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: cloudflare
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Set all player energy to 3
        uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: cloudflare
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute steemflags --remote --file=migrations/0003_set_daily_energy_to_3.sql

      - name: Remove legacy energy_purchases table
        uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: cloudflare
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute steemflags --remote --file=migrations/0002_drop_energy_purchases.sql
