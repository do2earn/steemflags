name: Patch earnsteem page
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch earnsteem.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('earnsteem.html')
          s=p.read_text(encoding='utf-8')
          marker='</body>'
          patch=r'''<script type="module" id="earnSteemTranslationPatch">import{getLanguage}from'./js/i18n.js';const N={en:['⚠️ Make sure to use the tags #steemgame and #steemflags when publishing; Otherwise, the Game Curation Team will not identify your content for an upvote.','✅ To support the development of Steem Flags game, Please set "Beneficiaries" option to at least 10% and set the username to "@do2earn" (the Steem Flags game developer) when publishing.'],fa:['⚠️ هنگام انتشار، حتماً از تگ‌های #steemgame و #steemflags استفاده کنید؛ در غیر این صورت، تیم کیوریشن بازی محتوای شما را برای دریافت رأی مثبت شناسایی نخواهد کرد.','✅ برای حمایت از توسعه بازی Steem Flags، لطفاً هنگام انتشار گزینه «Beneficiaries» را حداقل روی ۱۰٪ تنظیم کرده و نام کاربری «@do2earn» (توسعه‌دهنده بازی Steem Flags) را وارد کنید.'],ur:['⚠️ شائع کرتے وقت #steemgame اور #steemflags ٹیگز ضرور استعمال کریں؛ بصورت دیگر Game Curation Team آپ کے مواد کو اپ ووٹ کے لیے شناخت نہیں کرے گی۔','✅ Steem Flags گیم کی ترقی میں مدد کے لیے، براہ کرم شائع کرتے وقت "Beneficiaries" آپشن کو کم از کم 10% پر سیٹ کریں اور صارف نام "@do2earn" (Steem Flags گیم ڈویلپر) درج کریں۔'],hi:['⚠️ प्रकाशित करते समय #steemgame और #steemflags टैग का उपयोग करना सुनिश्चित करें; अन्यथा Game Curation Team आपके कंटेंट को अपवोट के लिए पहचान नहीं पाएगी।','✅ Steem Flags गेम के विकास में सहायता करने के लिए, प्रकाशित करते समय "Beneficiaries" विकल्प को कम से कम 10% पर सेट करें और उपयोगकर्ता नाम "@do2earn" (Steem Flags गेम डेवलपर) दर्ज करें।'],bn:['⚠️ প্রকাশ করার সময় #steemgame এবং #steemflags ট্যাগ ব্যবহার করতে ভুলবেন না; অন্যথায় Game Curation Team আপনার কনটেন্টকে আপভোটের জন্য শনাক্ত করতে পারবে না।','✅ Steem Flags গেমের উন্নয়নে সহায়তা করতে, প্রকাশের সময় "Beneficiaries" অপশনটি কমপক্ষে 10%-এ সেট করুন এবং ব্যবহারকারীর নাম "@do2earn" (Steem Flags গেমের ডেভেলপার) দিন।'],es:['⚠️ Asegúrate de usar las etiquetas #steemgame y #steemflags al publicar; de lo contrario, el Equipo de Curación del Juego no identificará tu contenido para un voto positivo.','✅ Para apoyar el desarrollo del juego Steem Flags, establece la opción "Beneficiaries" en al menos un 10 % y usa el nombre de usuario "@do2earn" (el desarrollador del juego Steem Flags) al publicar.'],zh:['⚠️ 发布时请务必使用 #steemgame 和 #steemflags 标签；否则，游戏策展团队将无法识别您的内容并进行点赞。','✅ 为支持 Steem Flags 游戏的开发，请在发布时将“Beneficiaries”选项设置为至少 10%，并将用户名设置为“@do2earn”（Steem Flags 游戏开发者）。'],ko:['⚠️ 게시할 때 반드시 #steemgame 및 #steemflags 태그를 사용하세요. 그렇지 않으면 Game Curation Team이 업보트를 위한 콘텐츠를 식별할 수 없습니다.','✅ Steem Flags 게임 개발을 지원하려면 게시할 때 "Beneficiaries" 옵션을 최소 10%로 설정하고 사용자 이름을 "@do2earn"(Steem Flags 게임 개발자)으로 설정하세요.']};function render(){const l=getLanguage(),t=N[l]||N.en;const n=document.querySelectorAll('#publishGameplayNotice p');if(n.length>=2){n[0].textContent=t[0];n[1].textContent=t[1]}const h=document.getElementById('publishGameplayHint');if(h){h.textContent='';h.style.display='none'}}render();window.addEventListener('languagechange',render);</script>'''
          if 'id="earnSteemTranslationPatch"' not in s:
              s=s.replace(marker,patch+marker)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add earnsteem.html
          git diff --cached --quiet || git commit -m 'Fix Earn Steem translation and hide publish hint'
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/patch-earnsteem.yml
          git add .github/workflows/patch-earnsteem.yml
          git commit -m 'Remove temporary earnsteem patch workflow'
          git push
