name: Patch earnsteem publish form

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-earnsteem-publish.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch earnsteem.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('earnsteem.html')
          s = p.read_text(encoding='utf-8')
          marker = '</main>'
          if 'id="publishGameplayCard"' not in s:
              card = '''<section id="publishGameplayCard" class="card publishGameplayCard"><div class="publishGameplayInner"><h2 id="publishGameplayTitle">📝 Publish a Gameplay Content for Steem Flags</h2><label for="steemPlatformSelect" id="steemPlatformLabel">Select a Steem Platform:</label><select id="steemPlatformSelect"><option value="steemit">Steemit</option><option value="steempro" selected>SteemPro</option><option value="steemx">SteemX</option><option value="speem">Speem</option></select><label for="beneficiaryPercentSelect" id="beneficiaryPercentLabel">Set Beneficiaries to @do2earn (Steem Flags Developer):</label><select id="beneficiaryPercentSelect"><option value="10" selected>%10</option><option value="20">%20</option><option value="30">%30</option><option value="40">%40</option><option value="50">%50</option></select><button id="publishGameplayButton" type="button">Publish a Gameplay Content for Steem Flags</button><p id="publishGameplayHint" class="publishGameplayHint"></p></div></section>'''
              s = s.replace(marker, card + marker, 1)
          if 'id="publishGameplayRuntime"' not in s:
              runtime = '''<script type="module" id="publishGameplayRuntime">import{getLanguage}from'./js/i18n.js';const PUBLISH_TEXT={en:{title:'📝 Publish a Gameplay Content for Steem Flags',platform:'Select a Steem Platform:',beneficiary:'Set Beneficiaries to @do2earn (Steem Flags Developer):',button:'Publish a Gameplay Content for Steem Flags',hint:'The selected Steem editor will open in a new tab.'},fa:{title:'📝 انتشار محتوای گیم‌پلی برای Steem Flags',platform:'یک پلتفرم Steem را انتخاب کنید:',beneficiary:'سهم @do2earn (توسعه‌دهنده Steem Flags):',button:'انتشار محتوای گیم‌پلی برای Steem Flags',hint:'ویرایشگر پلتفرم انتخاب‌شده در تب جدید باز می‌شود.'},ur:{title:'📝 Steem Flags کے لیے گیم پلے مواد شائع کریں',platform:'Steem پلیٹ فارم منتخب کریں:',beneficiary:'@do2earn (Steem Flags Developer) کے لیے بینیفشری مقرر کریں:',button:'Steem Flags کے لیے گیم پلے مواد شائع کریں',hint:'منتخب Steem ایڈیٹر ایک نئے ٹیب میں کھلے گا.'},hi:{title:'📝 Steem Flags के लिए गेमप्ले सामग्री प्रकाशित करें',platform:'Steem प्लेटफ़ॉर्म चुनें:',beneficiary:'@do2earn (Steem Flags Developer) के लिए Beneficiary सेट करें:',button:'Steem Flags के लिए गेमप्ले सामग्री प्रकाशित करें',hint:'चयनित Steem एडिटर नए टैब में खुलेगा।'},bn:{title:'📝 Steem Flags-এর জন্য গেমপ্লে কনটেন্ট প্রকাশ করুন',platform:'একটি Steem প্ল্যাটফর্ম নির্বাচন করুন:',beneficiary:'@do2earn (Steem Flags Developer)-এর জন্য Beneficiary সেট করুন:',button:'Steem Flags-এর জন্য গেমপ্লে কনটেন্ট প্রকাশ করুন',hint:'নির্বাচিত Steem এডিটর নতুন ট্যাবে খুলবে।'},es:{title:'📝 Publicar contenido de gameplay para Steem Flags',platform:'Selecciona una plataforma de Steem:',beneficiary:'Establecer beneficiario @do2earn (desarrollador de Steem Flags):',button:'Publicar contenido de gameplay para Steem Flags',hint:'El editor de Steem seleccionado se abrirá en una nueva pestaña.'},zh:{title:'📝 发布 Steem Flags 游戏内容',platform:'选择 Steem 平台：',beneficiary:'将 @do2earn（Steem Flags 开发者）设置为受益人：',button:'发布 Steem Flags 游戏内容',hint:'所选 Steem 编辑器将在新标签页中打开。'},ko:{title:'📝 Steem Flags 게임플레이 콘텐츠 게시',platform:'Steem 플랫폼 선택:',beneficiary:'@do2earn (Steem Flags 개발자) 수혜자 설정:',button:'Steem Flags 게임플레이 콘텐츠 게시',hint:'선택한 Steem 편집기가 새 탭에서 열립니다.'}};const EDITORS={steemit:'https://steemit.com/submit',steempro:'https://www.steempro.com/submit',steemx:'https://www.steemx.org/submit',speem:'https://speem.watch/submit'};function renderPublish(){const l=getLanguage(),t=PUBLISH_TEXT[l]||PUBLISH_TEXT.en;document.getElementById('publishGameplayTitle').textContent=t.title;document.getElementById('steemPlatformLabel').textContent=t.platform;document.getElementById('beneficiaryPercentLabel').textContent=t.beneficiary;document.getElementById('publishGameplayButton').textContent=t.button;document.getElementById('publishGameplayHint').textContent=t.hint}function initPublish(){renderPublish();document.getElementById('publishGameplayButton').addEventListener('click',()=>{const platform=document.getElementById('steemPlatformSelect').value;const percent=Number(document.getElementById('beneficiaryPercentSelect').value);const weight=percent*100;const base=EDITORS[platform]||EDITORS.steempro;const url=base+'?beneficiary=do2earn&beneficiaryWeight='+weight+'&beneficiaryPercent='+percent;window.open(url,'_blank','noopener,noreferrer')});window.addEventListener('languagechange',renderPublish)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initPublish);else initPublish();</script>'''
              s = s.replace('</body>', runtime + '</body>', 1)
          css = '''<style id="publishGameplayStyles">.publishGameplayCard{width:100%;box-sizing:border-box;text-align:left;margin-top:0}.publishGameplayInner{display:flex;flex-direction:column;gap:12px}.publishGameplayInner h2{margin:0 0 6px;font-size:1.45rem;line-height:1.35;color:aqua}.publishGameplayInner label{font-weight:800;font-size:1rem}.publishGameplayInner select{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:#101827;color:#fff;font-size:1rem}.publishGameplayInner button{width:100%;padding:13px 16px;border:0;border-radius:10px;background:#16a34a;color:#fff;font-weight:800;font-size:1rem;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2)}.publishGameplayHint{margin:2px 0 0;font-size:.9rem;color:rgba(255,255,255,.7);line-height:1.4}@media(max-width:560px){.publishGameplayCard{padding:14px 13px 16px}.publishGameplayInner h2{font-size:1.25rem}.publishGameplayInner label,.publishGameplayInner select,.publishGameplayInner button{font-size:.95rem}}</style>'''
          if 'id="publishGameplayStyles"' not in s:
              s = s.replace('</body>', css + '</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add earnsteem.html
          git diff --cached --quiet || git commit -m 'Add Steem platform gameplay publishing form'
          git push
