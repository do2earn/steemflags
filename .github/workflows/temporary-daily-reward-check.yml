name: Temporary Daily Reward Check
on:
  push:
    paths:
      - ".github/workflows/temporary-daily-reward-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check and claim today's reward for do2earn
        env:
          WORKER_URL: https://steemflags.mehdiq.workers.dev
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "$WORKER_URL/api/daily-reward/claim" \
            -H "Content-Type: application/json" \
            --data '{"username":"do2earn"}' | tee response.json
