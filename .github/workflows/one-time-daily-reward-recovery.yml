name: One-time Daily Reward Claim Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-daily-reward-recovery.yml'

permissions:
  contents: read

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - name: Claim today's reward for the account
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -X POST "https://steemflags.mehdiq.workers.dev/api/daily-reward/claim" \
            -H "Content-Type: application/json" \
            --data '{"username":"mehdiq1980"}')"
          echo "$response" | jq .
          echo "$response" | jq -e '.success == true' >/dev/null
