name: Check live Steem Flags D1

on:
  push:
    paths:
      - '.github/workflows/check-live-d1.yml'
      - 'cloudflare/worker.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-live-d1:
    runs-on: ubuntu-latest
    steps:
      - name: Read live API diagnostics
        shell: bash
        run: |
          set -euo pipefail
          response=""
          for endpoint in \
            "https://steemflags.do2earn.dev/api/health" \
            "https://steemflags.do2earn.workers.dev/api/health"; do
            echo "Checking $endpoint"
            if response="$(curl --fail --silent --show-error --max-time 20 "$endpoint")"; then
              break
            fi
            response=""
          done
          if [ -z "$response" ]; then
            echo "::error::Could not read the live /api/health endpoint."
            exit 1
          fi
          RESPONSE_JSON="$response" python3 - <<'PY'
          import json, os, sys
          try:
              data = json.loads(os.environ["RESPONSE_JSON"])
          except Exception as exc:
              print(f"Health endpoint did not return valid JSON: {exc}")
              sys.exit(1)
          db = data.get("database") or {}
          print("Service:", data.get("service", "unknown"))
          print("Worker:", data.get("worker", "unknown"))
          print("API success:", data.get("success"))
          print("D1 configured:", db.get("configured"))
          print("D1 status:", db.get("status"))
          print("Account count:", db.get("account_count", "unavailable"))
          objects = db.get("objects") or []
          print("D1 tables/views:", ", ".join(sorted(str(x.get("name", "")) for x in objects)) or "unavailable")
          columns = db.get("accounts_columns") or []
          print("Accounts columns:", ", ".join(str(x.get("name", "")) for x in columns) or "unavailable")
          if not data.get("success") or db.get("status") != "ok":
              sys.exit(1)
          PY
          echo "Checking public Steem Games endpoint"
          games_response="$(curl --silent --show-error --max-time 20 -w '\nHTTP_STATUS:%{http_code}' 'https://steemflags.do2earn.workers.dev/api/games')"
          printf '%s\n' "$games_response"
          GAMES_RESPONSE="$games_response" python3 - <<'PY'
          import json, os, sys
          raw = os.environ["GAMES_RESPONSE"]
          body, marker, status = raw.rpartition("\nHTTP_STATUS:")
          if not marker or status != "200":
              print("Steem Games API returned a non-200 response.")
              sys.exit(1)
          try:
              data = json.loads(body)
          except Exception as exc:
              print(f"Steem Games API returned invalid JSON: {exc}")
              sys.exit(1)
          games = data.get("games")
          print("API success:", data.get("success"))
          print("Games returned:", len(games) if isinstance(games, list) else "invalid")
          if not data.get("success") or not isinstance(games, list):
              print("API response:", body[:2000])
              sys.exit(1)
          PY
