name: Restore D1 Backup to do2earn

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-d1-database.yml"

permissions:
  actions: read
  contents: read

jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check required secrets
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.STEEMFLAGS_D1_BACKUP }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "Missing STEEMFLAGS_D1_BACKUP"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$BACKUP_PASSWORD" || { echo "Missing BACKUP_ENCRYPTION_PASSWORD"; exit 1; }
          echo "Required secrets are present."

      - name: Download encrypted backup artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/d1-backup"
          gh run download 39763014572 --repo do2earn/steemflags \
            --name steemflags-d1-encrypted-backup \
            --dir "$RUNNER_TEMP/d1-backup"
          test -s "$RUNNER_TEMP/d1-backup/steemflags-backup.sql.enc"
          test -s "$RUNNER_TEMP/d1-backup/SHA256SUMS.txt"
          expected_sha="$(awk '{print $1}' "$RUNNER_TEMP/d1-backup/SHA256SUMS.txt")"
          actual_sha="$(sha256sum "$RUNNER_TEMP/d1-backup/steemflags-backup.sql.enc" | awk '{print $1}')"
          test -n "$expected_sha" && test "$expected_sha" = "$actual_sha" || { echo "Encrypted backup checksum mismatch; refusing to restore."; exit 1; }
          echo "Encrypted backup checksum verified."

      - name: Decrypt backup and validate SQL
        shell: bash
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          encrypted="$RUNNER_TEMP/d1-backup/steemflags-backup.sql.enc"
          plain="$RUNNER_TEMP/steemflags-restore.sql"
          trap 'rm -f "$plain"' EXIT
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in "$encrypted" -out "$plain" -pass env:BACKUP_PASSWORD
          test -s "$plain"
          grep -qi 'CREATE TABLE' "$plain"
          echo "Backup checksum and decryption passed; SQL contains table definitions."

      - name: Ensure destination database is empty
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STEEMFLAGS_D1_BACKUP }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 execute do2earn --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%';" \
            --json --config cloudflare/wrangler.toml > "$RUNNER_TEMP/destination-before.json"
          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync(process.env.RUNNER_TEMP + '/destination-before.json', 'utf8');
          let data;
          try { data = JSON.parse(raw); } catch { console.error('Could not parse destination inspection output; refusing to restore.'); process.exit(1); }
          const text = JSON.stringify(data);
          if (/"results"\s*:\s*\[\s*\{/.test(text)) {
            console.error('Destination appears to contain tables or inspection output was unexpected; refusing to overwrite.');
            process.exit(1);
          }
          if (Array.isArray(data) && data.some(x => Array.isArray(x.results) && x.results.length > 0)) {
            console.error('Destination is not empty; refusing to overwrite.');
            process.exit(1);
          }
          console.log('Destination inspection completed; continuing only if no application tables are present.');
          NODE

      - name: Restore encrypted backup into destination
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STEEMFLAGS_D1_BACKUP }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          plain="$RUNNER_TEMP/steemflags-restore.sql"
          trap 'rm -f "$plain"' EXIT
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in "$RUNNER_TEMP/d1-backup/steemflags-backup.sql.enc" \
            -out "$plain" -pass env:BACKUP_PASSWORD
          npx --yes wrangler@latest d1 execute do2earn --remote \
            --file="$plain" --config cloudflare/wrangler.toml
          rm -f "$plain"
          echo "Restore command completed. Production Worker binding remains unchanged."

      - name: Verify restored table counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STEEMFLAGS_D1_BACKUP }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          query="SELECT 'accounts' AS table_name, COUNT(*) AS row_count FROM accounts UNION ALL SELECT 'ad_sessions', COUNT(*) FROM ad_sessions UNION ALL SELECT 'app_migrations', COUNT(*) FROM app_migrations UNION ALL SELECT 'daily_rewards', COUNT(*) FROM daily_rewards UNION ALL SELECT 'energy_orders', COUNT(*) FROM energy_orders UNION ALL SELECT 'energy_purchases', COUNT(*) FROM energy_purchases UNION ALL SELECT 'game_events', COUNT(*) FROM game_events UNION ALL SELECT 'sponsor_ad_events', COUNT(*) FROM sponsor_ad_events UNION ALL SELECT 'sponsor_ad_sessions', COUNT(*) FROM sponsor_ad_sessions;"
          npx --yes wrangler@latest d1 execute do2earn --remote --command "$query" \
            --json --config cloudflare/wrangler.toml > "$RUNNER_TEMP/restored-counts.json"
          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync(process.env.RUNNER_TEMP + '/restored-counts.json', 'utf8');
          let data;
          try { data = JSON.parse(raw); } catch { console.error('Could not parse verification query output.'); process.exit(1); }
          function findRows(x) {
            if (!x || typeof x !== 'object') return null;
            if (Array.isArray(x.results) && x.results.length && x.results.every(r => r && typeof r === 'object' && 'table_name' in r && 'row_count' in r)) return x.results;
            for (const v of Object.values(x)) { const r = findRows(v); if (r) return r; }
            return null;
          }
          const rows = findRows(data);
          if (!rows) { console.error('Could not find expected table-count results in Wrangler output.'); process.exit(1); }
          const expected = {accounts:25, ad_sessions:22, app_migrations:1, daily_rewards:42, energy_orders:1, energy_purchases:9, game_events:115, sponsor_ad_events:124, sponsor_ad_sessions:140};
          const actual = Object.fromEntries(rows.map(r => [r.table_name, Number(r.row_count)]));
          for (const [table, count] of Object.entries(expected)) {
            if (actual[table] !== count) {
              console.error(`Verification failed for ${table}: expected ${count}, got ${actual[table] ?? 'missing'}`);
              process.exit(1);
            }
          }
          if (rows.length !== Object.keys(expected).length) {
            console.error(`Expected 9 application tables, got ${rows.length}.`);
            process.exit(1);
          }
          console.log('Restore verified: all 9 application tables match expected row counts (479 total rows).');
          console.log('Original steemflags database and Worker binding were not changed.');
          NODE
