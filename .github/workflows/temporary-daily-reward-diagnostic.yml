name: Temporary Daily Reward Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-daily-reward-diagnostic.yml'
      - 'cloudflare/worker.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read daily reward diagnostic from Worker
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors "https://steemflags.mehdiq.workers.dev/api/accounts?limit=10000" | jq '{success, matches: [.accounts[] | select((.D2E | tonumber) == 62)]}'
