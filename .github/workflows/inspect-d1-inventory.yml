name: Inspect Steem Flags D1 inventory

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-d1-inventory.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify read-only D1 token and inspect D1 inventory
        env:
          CLOUDFLARE_D1_READ_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_D1_READ_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Cloudflare API token/account ID secrets are not available to this workflow."
            exit 1
          fi

          echo "Diagnostic: checking token formatting without revealing its value."
          python3 - <<'PY'
          import os
          token = os.environ.get("CLOUDFLARE_D1_READ_TOKEN", "")
          print("Token length:", len(token))
          print("Leading/trailing whitespace present:", token != token.strip())
          print("Whitespace inside token:", any(ch.isspace() for ch in token.strip()))
          print("Account ID length:", len(os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")))
          PY

          verify_code="$(curl --silent --show-error --max-time 30 -o verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_D1_READ_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")"
          echo "Token verification HTTP status: $verify_code"
          python3 - <<'PY'
          import json
          try:
              data = json.load(open("verify.json"))
          except Exception:
              print("Token verification response was not valid JSON.")
              raise SystemExit(1)
          print("Token verification success:", data.get("success", False))
          for error in data.get("errors", []):
              print("Cloudflare error code:", error.get("code", "unknown"))
              print("Cloudflare error message:", error.get("message", "No message"))
          if not data.get("success"):
              raise SystemExit("Token verification failed; stopping before D1 inventory request.")
          PY

          inventory_code="$(curl --silent --show-error --max-time 30 -o inventory.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_D1_READ_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100")"
          echo "D1 inventory HTTP status: $inventory_code"
          RESPONSE_JSON="$(cat inventory.json)" python3 - <<'PY'
          import json, os, sys
          data = json.loads(os.environ["RESPONSE_JSON"])
          if not data.get("success"):
              for error in data.get("errors", []):
                  print("Cloudflare error code:", error.get("code", "unknown"))
                  print("Cloudflare error message:", error.get("message", "No message"))
              sys.exit(1)
          items = data.get("result") or []
          matches = [x for x in items if any(k in str(x.get("name", "")).lower() for k in ("steemflags", "do2earn"))]
          if not matches:
              print("No D1 database names matching steemflags or do2earn were found.")
          for item in matches:
              print("Database:", item.get("name"))
              print("ID:", item.get("uuid"))
              print("Tables:", item.get("num_tables", "unknown"))
              print("Size bytes:", item.get("file_size", "unknown"))
              print("---")
          print("Matching databases:", len(matches))
          PY

          echo "Running read-only SQL inspection against the known Steem Flags D1 database."
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, sys

          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_D1_READ_TOKEN"]
          database_id = "30c7f54b-5bc6-4fca-b6cf-1a3c319bacfc"
          endpoint = f"https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{database_id}/query"

          def query(sql):
              body = json.dumps({"sql": sql}).encode()
              req = urllib.request.Request(
                  endpoint, data=body, method="POST",
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = json.loads(response.read().decode())
              except urllib.error.HTTPError as exc:
                  print("D1 SQL HTTP status:", exc.code)
                  print(exc.read().decode()[:1500])
                  sys.exit(1)
              if not payload.get("success"):
                  print("D1 SQL query failed:")
                  for error in payload.get("errors", []):
                      print(error.get("code"), error.get("message"))
                  sys.exit(1)
              results = payload.get("result") or []
              if not results:
                  return []
              return results[0].get("results") or []

          schema = query(
              "SELECT type, name, sql FROM sqlite_master "
              "WHERE name NOT LIKE 'sqlite_%' ORDER BY type, name"
          )
          print("Schema objects found:", len(schema))
          for obj in schema:
              print(f"OBJECT {obj.get('type')}: {obj.get('name')}")
              if obj.get("sql"):
                  print("DDL:", " ".join(obj["sql"].split()))

          tables = query("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name")
          print("Application tables found:", len(tables))
          for item in tables:
              name = item["name"]
              quoted = '"' + name.replace('"', '""') + '"'
              rows = query(f"SELECT COUNT(*) AS row_count FROM {quoted}")
              count = rows[0].get("row_count", "unknown") if rows else "unknown"
              print(f"ROW COUNT {name}: {count}")
          print("Read-only SQL inspection completed.")
          PY
