name: Daily Reward Diagnostics
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/daily-reward-diagnostics.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read daily reward state for mehdiq1989
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          npx --yes wrangler@4 d1 execute steemflags --remote --json --command "SELECT date('now') AS utc_date, EXISTS(SELECT 1 FROM accounts WHERE lower(Username)='mehdiq1989') AS account_exists, (SELECT CASE WHEN TRIM(COALESCE(Flag,''))='' THEN 0 ELSE 1 END FROM accounts WHERE lower(Username)='mehdiq1989' LIMIT 1) AS has_flag, (SELECT COUNT(*) FROM accounts a WHERE TRIM(COALESCE(a.Flag,''))=(SELECT TRIM(COALESCE(b.Flag,'')) FROM accounts b WHERE lower(b.Username)='mehdiq1989' LIMIT 1) AND TRIM(COALESCE(a.Flag,''))<>'') AS flag_players, (SELECT Reward FROM daily_rewards WHERE lower(Username)='mehdiq1989' AND RewardDate=date('now') LIMIT 1) AS ledger_reward, (SELECT Status FROM daily_rewards WHERE lower(Username)='mehdiq1989' AND RewardDate=date('now') LIMIT 1) AS ledger_status, EXISTS(SELECT 1 FROM daily_rewards WHERE lower(Username)='mehdiq1989' AND RewardDate=date('now')) AS ledger_exists;"
