<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Weekly $STEEM Rewards Pool</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Arial, Helvetica, sans-serif; background: #080d1a; color: #f5f7fb; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 8px; }
    .reward-card { width: 100%; padding: 14px 16px; border: 1px solid rgba(255,255,255,.18); border-radius: 14px; background: rgba(17,26,48,.94); box-shadow: 0 8px 24px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.05); }
    h1 { margin: 0 0 10px; font-size: 18px; line-height: 1.3; font-weight: 700; }
    .item { margin: 6px 0; font-size: 14px; line-height: 1.4; font-weight: 500; }
  </style>
</head>
<body>
  <main class="reward-card" aria-label="Weekly STEEM Rewards Pool">
    <h1>💰 Weekly $STEEM Rewards Pool</h1>
    <div class="item">✅ Amount: 20 ~ 100 $STEEM</div>
    <div class="item">✅ Distributed to the top 5 gamers on the leaderboard</div>
  </main>
</body>
</html>
