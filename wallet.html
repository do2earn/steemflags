<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d1a">
<meta name="description" content="My Wallet - Steem Flags">
<title>My Wallet - Steem Flags</title>
<link rel="stylesheet" href="css/style.css?v=20260830-footer-01">
<link rel="stylesheet" href="css/preloader.css?v=20260826-01">
<script src="js/preloader.js?v=20260826-01" defer></script>
<script src="js/d2e-logo.js?v=20260825-02" defer></script>
</head>
<body>
<div id="app"></div>
<script type="module">
import {getStoredUsername,loadState,refreshDailyEnergy,syncPurchasedEnergy} from './js/storage.js?v=20260822-about-02';
import {loadMenu} from './js/menu.js?v=20260820-05';
import {loadAssetBar as loadSharedAssetBar,refreshAssetBar} from './js/asset-bar.js?v=20260826-assetbar-04';

const API='https://api.steemit.com';

function amount(v,decimals=3){return Number(v||0).toFixed(decimals);}
function assetIcon(type){return type==='energy'?'⚡':type==='d2e'?'◈':'$';}

function assetRow(type,label,value,unit=''){
 return '<div class="walletAsset"><div class="assetName"><span class="assetIcon '+type+'">'+assetIcon(type)+'</span><span>'+label+'</span></div><strong>'+value+(unit?'<small>'+unit+'</small>':'')+'</strong></div>';
}

function renderWallet(username, internal, external){
 const main=document.querySelector('main.appShell');
 if(!main)return;
 main.innerHTML=`<section class="walletContent">
  <div class="walletHeading"><span class="walletHeadingIcon" aria-hidden="true"><svg viewBox="0 0 24 24" role="img"><path d="M3.5 6.5A2.5 2.5 0 0 1 6 4h11.5A2.5 2.5 0 0 1 20 6.5v1H8.5A2.5 2.5 0 0 0 6 10v4.5A2.5 2.5 0 0 0 8.5 17H20v1a2.5 2.5 0 0 1-2.5 2.5H6A2.5 2.5 0 0 1 3.5 18V6.5Z"/><path d="M8.5 9.5H20a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H8.5A1.5 1.5 0 0 1 7 15v-4a1.5 1.5 0 0 1 1.5-1.5Z"/><circle cx="17" cy="13" r="1"/></svg></span><h1>My Wallet</h1></div>
  <div class="walletCards">
   <article class="walletCard internalCard">
    <div class="walletCardHeader"><div><span class="walletLabel">INTERNAL</span><h2>Internal Wallet</h2></div><span class="walletHeaderIcon">◈</span></div>
    <div class="walletAssets">
      <div class="walletAssetWithAction">
        <div class="walletAsset">
          <div class="assetName"><span class="assetIcon energy">⚡</span><span>⚡ Energy</span></div><strong>${amount(internal.energy,0)}</strong>
        </div>
        <a class="primary walletAction activeAction" href="shop.html"><span>⚡</span> Buy more Energy</a>
      </div>
      <div class="walletAssetWithAction">
        <div class="walletAsset">
          <div class="assetName"><span class="assetIcon d2e">◈</span><span>D2E (Do2Earn)</span></div><strong>${amount(internal.d2e,0)}</strong>
        </div>
        <button class="walletAction secondary" disabled><span>⇄</span> Swap D2E to $STEEM</button>
        <div class="walletLimit">ⓘ Min: 10,000 D2E • Rate: 1,000 D2E = 1 $STEEM</div>
      </div>
      <div class="walletAssetWithAction">
        <div class="walletAsset">
          <div class="assetName"><span class="assetIcon steem">$</span><span>$STEEM</span></div><strong>${amount(internal.steem)}</strong>
        </div>
        <button class="walletAction secondary" disabled><span>↗</span> Withdraw $STEEM to External Wallet</button>
        <div class="walletLimit">ⓘ Min: 10 $STEEM • Limit: 10 $STEEM / 7 days</div>
      </div>
    </div>
   </article>
   <article class="walletCard externalCard">
    <div class="walletCardHeader"><div><span class="walletLabel">BLOCKCHAIN</span><h2>External Wallet</h2></div><span class="walletHeaderIcon">⛓</span></div>
    <div class="walletAssets">
      ${assetRow('steem','$STEEM',amount(external.steem))}
      <a class="primary walletAction activeAction earnSteemAction" href="earnmoresteem.html"><span>💰</span> Earn more $STEEM by Steem Flags</a>
      ${assetRow('sp','SP (Steem Power)',amount(external.sp))}
      ${assetRow('sbd','$SBD (Steem Based Dollar)',amount(external.sbd))}
    </div>
    <div class="externalNote">Live balance from the Steem blockchain</div>
   </article>
  </div>
 </section>`;
}

async function getExternalWallet(username){
 const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',method:'condenser_api.get_accounts',params:[[username]],id:1}),cache:'no-store'});
 if(!r.ok)throw new Error('Steem API request failed');
 const j=await r.json(); const a=j?.result?.[0];
 if(!a)throw new Error('Steem account not found');
 const vesting=Number(String(a.vesting_shares||'0').split(' ')[0]);
 const delegated=Number(String(a.delegated_vesting_shares||'0').split(' ')[0]);
 const received=Number(String(a.received_vesting_shares||'0').split(' ')[0]);
 const dynamic=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',method:'condenser_api.get_dynamic_global_properties',params:[],id:2}),cache:'no-store'}).then(x=>x.json());
 const dg=dynamic?.result;
 const totalVests=Number(String(dg?.total_vesting_shares||'0').split(' ')[0]);
 const totalFund=Number(String(dg?.total_vesting_fund_steem||'0').split(' ')[0]);
 const effective=Math.max(0,vesting+received-delegated);
 const sp=totalVests>0?effective*totalFund/totalVests:0;
 return {steem:Number(String(a.balance||'0').split(' ')[0]),sbd:Number(String(a.sbd_balance||'0').split(' ')[0]),sp};
}

async function loadWalletPage(){
 const app=document.getElementById('app');
 const response=await fetch('./components/app-shell.html?v=20260904-about-01',{cache:'no-store'});
 app.innerHTML=await response.text();
 ['loginView','homeView','leaderboardSection','gameView'].forEach(id=>document.getElementById(id)?.remove());
 const main=document.querySelector('main.appShell');
 if(main)main.innerHTML='<section class="walletContent"></section>';
 const username=getStoredUsername() || (()=>{try{return JSON.parse(localStorage.getItem('steemFlagsAuthSession')||'null')?.username||null}catch{return null}})();
 await loadSharedAssetBar();
 if(!username){
   if(main)main.innerHTML='<section class="walletContent"><div class="walletHeading"><span class="walletHeadingIcon">👛</span><h1>My Wallet</h1></div><article class="walletCard walletLogin"><p>Please log in to view your wallet.</p><a class="primary walletAction" href="index.html">Login</a></article></section>';
   await loadMenu(); return;
 }
 const state=await syncPurchasedEnergy(refreshDailyEnergy(loadState(username),username),username);
 await refreshAssetBar(username);
 let account=null;
 try{
   const accountResponse=await fetch(`https://steemflags.mehdiq.workers.dev/api/account?username=${encodeURIComponent(username)}`,{cache:'no-store'});
   if(accountResponse.ok){
     const accountData=await accountResponse.json();
     if(accountData?.success&&accountData.account) account=accountData.account;
   }
 }catch(error){console.warn('Wallet account sync failed',error)}
 const internal={
   energy:account ? Number(account.Energy||0) : Number(state?.energy||0),
   d2e:account ? Number(account.D2E||0) : Number(state?.d2e||state?.sf||0),
   steem:Number(account?.STEEM||state?.steem||0)
 };
 let external={steem:0,sp:0,sbd:0};
 try{external=await getExternalWallet(username)}catch(error){console.error(error)}
 renderWallet(username,internal,external);
 await loadMenu();
 window.dispatchEvent(new CustomEvent('steemflags:ready'));
}
loadWalletPage().catch(error=>{console.error(error);window.dispatchEvent(new CustomEvent('steemflags:ready'))});
</script>
<style>
.walletContent{max-width:760px;margin:0 auto;padding-bottom:20px}
.walletHeading{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 20px}
.walletHeading h1{margin:0}
.walletHeadingIcon{display:flex;align-items:center;justify-content:center;width:32px;height:32px}.walletHeadingIcon svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.walletCards{display:flex;flex-direction:column;gap:18px}
.walletCard{background:rgba(17,26,48,.94);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:20px 18px;box-sizing:border-box;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.walletCardHeader{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.13)}
.walletCardHeader h2{margin:2px 0 0;font-size:21px}
.walletLabel{font-size:11px;letter-spacing:1.3px;opacity:.55;font-weight:800}
.walletHeaderIcon{font-size:24px;opacity:.65}
.walletAssets{margin-top:3px}
.walletAsset{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:57px;padding:8px 0 8px 3px;border-bottom:1px solid rgba(255,255,255,.10);box-sizing:border-box}
.walletAsset:last-child{border-bottom:0}
.walletAssetWithAction>.walletAsset{border-bottom:0;padding-bottom:6px}
.walletAssetWithAction>.walletAction{margin:0 0 8px}
.walletLimit{text-align:center;font-size:10.5px;line-height:1.5;opacity:.52;margin:-2px 0 12px;white-space:nowrap}
.assetName{display:flex;align-items:center;gap:11px;min-width:0}
.assetName>span:last-child{overflow-wrap:anywhere}
.assetIcon{display:flex;align-items:center;justify-content:center;width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:rgba(255,255,255,.07);font-size:16px}
.walletAsset strong{display:flex;align-items:baseline;gap:4px;font-size:19px;white-space:nowrap;text-align:right}
.walletAsset strong small{font-size:11px;opacity:.55}
.walletActions{display:flex;flex-direction:column;gap:9px;margin-top:18px;padding-top:2px}
.walletAction{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;min-height:44px;box-sizing:border-box;text-align:center;padding:9px 13px;border-radius:10px;font-weight:700;text-decoration:none;border:1px solid transparent}
.walletAction.activeAction{box-shadow:0 4px 12px rgba(0,0,0,.12)}
.earnSteemAction{background:#22c55e;color:#fff;border-color:#22c55e}
.walletAction.secondary{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.10);color:rgba(255,255,255,.43);cursor:not-allowed}
.externalNote{text-align:center;font-size:11px;opacity:.45;margin-top:13px}
.walletLogin{text-align:center}
.walletLogin p{margin:4px 0 16px}
@media(max-width:560px){
 .walletContent{width:100%}
 .walletHeading{margin-top:3px;margin-bottom:16px}
 .walletCard{padding:17px 13px;border-radius:17px}
 .walletCardHeader h2{font-size:19px}
 .walletAsset{min-height:55px;padding:7px 0 7px 2px;font-size:15px}
 .walletAsset strong{font-size:17px}
 .assetIcon{width:32px;height:32px;flex-basis:32px}
 .walletAction{min-height:44px}
}
</style>
</body>
</html>
